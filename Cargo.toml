[workspace]
members = [
    "compositor",
    "shell",
    "services/vm-manager",
    "services/hot-reload",
    "apps/terminal",
    "apps/filemanager",
    "apps/editor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OblivionOS Team <developer@skygenesisenterprise.com>"]
license = "MIT"
repository = "https://github.com/skygenesisenterprise/oblivionos"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true