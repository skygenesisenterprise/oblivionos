# scripts/alpine-answers.conf — answers for `setup-alpine -e -a`.
# Drives setup-alpine through its expert-mode prompts so the expect installer
# doesn't have to type every reply. Variables match the names used inside
# Alpine's setup-alpine script.
#
# Format rules of thumb:
#   * One variable per line.
#   * Multi-line values use REAL linebreaks inside double quotes (NOT the
#     two-character sequence `\n`; setup-alpine reads the variable as a
#     literal string and embedded `\n` would be passed straight through).
#   * Defaults here are deliberately boring (US keyboard, dhcp, UTC, chrony,
#     sys-mode install to /dev/vda, openssh) so the resulting qcow2 is reusable.

KEYMAPOPTS="us us"
HOSTNAMEOPTS="-n oblivion-rdp"
INTERFACESOPTS="auto lo
iface lo inet loopback

auto eth0
iface eth0 inet dhcp"
DNSOPTS="-d local 1.1.1.1"
TIMEZONEOPTS="-z UTC"
NTPDOPTS="-c chrony"
APKREPOSOPTS="-1 -c -k"
SSHDOPTS="-c openssh"
DISKOPTS="-m sys -s 0 -v /dev/vda"
