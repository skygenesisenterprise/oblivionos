# scripts/alpine-oblivionos-vnc-answers.conf
#
# Answers file consumed by setup-alpine during the persistent qcow2 install.
# Based on alpine-answers.conf but trimmed for unattended xfce4 + x11vnc + (later)
# oblivion-compositor startup. Tested with Alpine v3.20 standard ISO.

# Keyboard layout
KEYMAPOPTS="us us"
# Hostname
HOSTNAMEOPTS="oblivionos"
# Interface
INTERFACESOPTS="auto lo
auto eth0
"
# DNS / domain: use Google + no domain (cloud-style)
DNSOPTS="-d example.com -n 8.8.8.8 1.1.1.1"
# timezone
TIMEZONEOPTS="-z UTC"
# NTP: yes, busybox ntpd
NTPOPTS="-c chrony"
# apk mirror
APKREPOSOPTS="-1 -r https://dl-cdn.alpinelinux.org/alpine/v3.20/main"
# User: create 'oblivion' as a sudo-capable user (wheel in Alpine) with no password
USEROPTS="-a -g wheel,audio,video,netdev -m -N"
USERADDCMD="adduser -g '' oblivion"
# Disk: use 'data' so we can write a partition; sys mode (no root login)
DISKOPTS="-m sys -w -s 0 -v 0"
# Proxy: none
PROXYOPTS="none"
# Install root: no ssh key injection, no root password (we'll set later)
ROOTPASSWDOPTS="-r"
SSHDOPTS="-c openssh"
# No https mirrors beyond what APKREPOSOPTS already does
HTTPSREPOOPTS=""
# Do not log to TTY (keeps the serial console clean for the expect script)
LOGGINGOPTS="-l warn"
